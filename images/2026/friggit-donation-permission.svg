<svg xmlns="http://www.w3.org/2000/svg" width="800" height="410" viewBox="0 0 800 410" font-family="system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><rect width="800" height="410" fill="#ffffff"/><text x="24" y="34" font-size="19" fill="#0b0b0b" font-weight="600">La permission d'acheter s'h&#233;rite</text><text x="24" y="56" font-size="13" fill="#52514e">Probabilit&#233; d'acheter sa r&#233;sidence principale, selon qu'on a re&#231;u ou non une donation</text><text x="60" y="96" font-size="14" fill="#0b0b0b" font-weight="600">Ensemble des m&#233;nages (achat avant 40 ans)</text><text x="60" y="120" font-size="12" fill="#52514e">sans h&#233;ritage ni donation</text><rect x="60" y="124" width="680" height="34" rx="4" fill="#eceae7"/><rect x="60" y="124" width="367.2" height="34" rx="4" fill="#52514e"/><text x="419.2" y="146.0" font-size="14" fill="#ffffff" text-anchor="end" font-weight="600">54&#160;%</text><text x="60" y="184" font-size="12" fill="#52514e">avec une donation</text><rect x="60" y="188" width="680" height="34" rx="4" fill="#eceae7"/><rect x="60" y="188" width="476.0" height="34" rx="4" fill="#2a78d6"/><text x="528.0" y="210.0" font-size="14" fill="#ffffff" text-anchor="end" font-weight="600">70&#160;%</text><text x="60" y="268" font-size="14" fill="#0b0b0b" font-weight="600">Quart des locataires les plus modestes</text><text x="60" y="292" font-size="12" fill="#52514e">sans donation</text><rect x="60" y="296" width="680" height="34" rx="4" fill="#eceae7"/><rect x="60" y="296" width="27.2" height="34" rx="4" fill="#52514e"/><text x="95.2" y="318.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">4&#160;%</text><text x="60" y="356" font-size="12" fill="#52514e">avec une donation</text><rect x="60" y="360" width="680" height="34" rx="4" fill="#eceae7"/><rect x="60" y="360" width="190.4" height="34" rx="4" fill="#2a78d6"/><text x="242.4" y="382.0" font-size="14" fill="#ffffff" text-anchor="end" font-weight="600">28&#160;%</text><text x="776" y="396" font-size="11" fill="#52514e" text-anchor="end">Source&#160;: Bonnet, Garbinti, Grobon, &#201;conomie et Statistique n&#176;&#160;500-502, INSEE, 2018</text></svg>