<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><rect width="800" height="400" fill="#ffffff"/><text x="24" y="34" font-size="19" fill="#0b0b0b" font-weight="600">Le parc appartient aux multipropri&#233;taires</text><text x="24" y="56" font-size="13" fill="#52514e">Part des m&#233;nages et part des logements poss&#233;d&#233;s par des particuliers qu'ils d&#233;tiennent, 2021</text><text x="60" y="96" font-size="14" fill="#0b0b0b" font-weight="600">Les multipropri&#233;taires (2 logements ou plus)</text><text x="60" y="120" font-size="12" fill="#52514e">part des m&#233;nages</text><rect x="60" y="124" width="680" height="34" rx="4" fill="#eceae7"/><rect x="60" y="124" width="163.2" height="34" rx="4" fill="#2a78d6"/><text x="215.2" y="146.0" font-size="14" fill="#ffffff" text-anchor="end" font-weight="600">24&#160;%</text><text x="60" y="184" font-size="12" fill="#52514e">part des logements d&#233;tenus par des particuliers</text><rect x="60" y="188" width="680" height="34" rx="4" fill="#eceae7"/><rect x="60" y="188" width="462.4" height="34" rx="4" fill="#2a78d6"/><text x="514.4" y="210.0" font-size="14" fill="#ffffff" text-anchor="end" font-weight="600">68&#160;%</text><text x="60" y="262" font-size="14" fill="#0b0b0b" font-weight="600">Les d&#233;tenteurs de 5 logements ou plus</text><text x="60" y="286" font-size="12" fill="#52514e">part des m&#233;nages</text><rect x="60" y="290" width="680" height="34" rx="4" fill="#eceae7"/><rect x="60" y="290" width="23.8" height="34" rx="4" fill="#2a78d6"/><text x="91.8" y="312.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">3,5&#160;%</text><text x="60" y="350" font-size="12" fill="#52514e">part du parc locatif des particuliers</text><rect x="60" y="354" width="680" height="34" rx="4" fill="#eceae7"/><rect x="60" y="354" width="340.0" height="34" rx="4" fill="#2a78d6"/><text x="392.0" y="376.0" font-size="14" fill="#ffffff" text-anchor="end" font-weight="600">50&#160;%</text><text x="776" y="386" font-size="11" fill="#52514e" text-anchor="end">Source&#160;: INSEE, France portrait social 2021 (donn&#233;es Fid&#233;li)</text></svg>